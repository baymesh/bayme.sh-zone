name: DNS and Web Flasher

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web-flasher/**'
      - 'dnsconfig.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FIRMWARE_PAGES_URL: 'https://firmware.bayme.sh'

jobs:
  dns-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install DNS Control
        uses: gacts/install-dnscontrol@v1
      - name: Run DNSControl
        run: dnscontrol push
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}

      - name: Actions Status Discord
        uses: sarisia/actions-status-discord@v1.14.5
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

  build-web-flasher:
    needs: dns-update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout zone repo (for gh-pages push target)
        uses: actions/checkout@v4
        with:
          repository: baymesh/bayme.sh-zone
          path: zone
          fetch-depth: 1

      - name: Checkout web-flasher source
        uses: actions/checkout@v4
        with:
          repository: baymesh/web-flasher
          path: zone/web-flasher
          sparse-checkout: |
            app.vue
            components
            composables
            i18n
            nuxt.config.ts
            package.json
            pnpm-lock.yaml
            public
            stores
            tailwind.config.js
            types
            utils
            README.md
            assets
            locales
            plugins
            server
            i18n.config.ts
            tsconfig.json
            eslint.config.mjs
            vitest.config.ts
            .npmrc
            .trunk
          sparse-checkout-cone-mode: false

      - name: Fetch latest firmware manifest
        run: |
          mkdir -p zone/web-flasher/public/data/firmware
          
          AVAILABLE_VERSIONS=$(curl -sL "${{ env.FIRMWARE_PAGES_URL }}/" 2>/dev/null | grep -oP 'firmware-[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Latest version found: $AVAILABLE_VERSIONS"
          
          if [ -n "$AVAILABLE_VERSIONS" ]; then
            curl -sL "${{ env.FIRMWARE_PAGES_URL }}/${AVAILABLE_VERSIONS}/firmware-${AVAILABLE_VERSIONS}.json" \
              -o "zone/web-flasher/public/data/firmware/firmware-${AVAILABLE_VERSIONS}.json" || true
            echo "Downloaded manifest for ${AVAILABLE_VERSIONS}"
            cat "zone/web-flasher/public/data/firmware/firmware-${AVAILABLE_VERSIONS}.json" || true
          fi
          
          echo "Firmware directory contents:"
          ls -la zone/web-flasher/public/data/firmware/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: |
          cd zone/web-flasher
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd zone/web-flasher
          pnpm run build

      - name: Deploy to main branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd zone
          
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baymesh/bayme.sh-zone.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          
          rm -rf .gitignore web-flasher/.git 2>/dev/null || true
          mkdir -p flasher
          cp -r web-flasher/.output/public/. flasher/
          cp web-flasher/.output/public/.nojekyll . 2>/dev/null || echo "" > .nojekyll
          printf 'flasher.bayme.sh\n' > flasher/CNAME
          rm -f CNAME
          
          git add flasher .nojekyll CNAME
          git commit -m "Deploy flasher $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main
