name: DNS and Web Flasher

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web-flasher/**'
      - 'dnsconfig.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FIRMWARE_PAGES_URL: 'https://baymesh.github.io/bayme.sh-firmware-pages'

jobs:
  dns-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DNS Control
        uses: gacts/install-dnscontrol@v1
      - name: Run DNSControl
        run: dnscontrol push
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}

      - name: Actions Status Discord
        uses: sarisia/actions-status-discord@v1.14.5
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

  build-web-flasher:
    needs: dns-update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-flasher
        uses: actions/checkout@v4
        with:
          repository: baymesh/web-flasher
          path: web-flasher
          sparse-checkout: |
            app.vue
            components
            composables
            i18n
            nuxt.config.ts
            package.json
            pnpm-lock.yaml
            public
            stores
            tailwind.config.js
            types
            utils
            README.md
            assets
            locales
            plugins
            server
            i18n.config.ts
            tsconfig.json
            eslint.config.mjs
            vitest.config.ts
            .npmrc
            .trunk
          sparse-checkout-cone-mode: false

      - name: Fetch latest firmware manifest
        run: |
          mkdir -p web-flasher/public/data/firmware
          
          MANIFEST_URL="${{ env.FIRMWARE_PAGES_URL }}/release_notes.md"
          echo "Checking for firmware at: $MANIFEST_URL"
          
          HTTP_CODE=$(curl -sL -o /tmp/response.html -w "%{http_code}" "${{ env.FIRMWARE_PAGES_URL }}/")
          echo "HTTP response code: $HTTP_CODE"
          
          curl -sL "${{ env.FIRMWARE_PAGES_URL }}/" -o /tmp/firmware_list.html 2>/dev/null || true
          
          AVAILABLE_VERSIONS=$(curl -sL "${{ env.FIRMWARE_PAGES_URL }}/" 2>/dev/null | grep -oP 'firmware-[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Latest version found: $AVAILABLE_VERSIONS"
          
          if [ -n "$AVAILABLE_VERSIONS" ]; then
            curl -sL "${{ env.FIRMWARE_PAGES_URL }}/${AVAILABLE_VERSIONS}/firmware-${AVAILABLE_VERSIONS}.json" \
              -o "web-flasher/public/data/firmware/firmware-${AVAILABLE_VERSIONS}.json" || true
            echo "Downloaded manifest for ${AVAILABLE_VERSIONS}"
            cat "web-flasher/public/data/firmware/firmware-${AVAILABLE_VERSIONS}.json" || true
          fi
          
          echo "Firmware directory contents:"
          ls -la web-flasher/public/data/firmware/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: |
          cd web-flasher
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd web-flasher
          pnpm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-flasher/.output/public
          destination_dir: flasher
